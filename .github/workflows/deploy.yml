# Publica o app no GitHub Pages a cada push na main.
# O projeto é 100% estático (sem build): o job só empacota os arquivos e envia.

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      # Carimba o SHA do commit no app e no service worker. É o que garante que
      # todo deploy gere um sw.js diferente em bytes: o navegador reinstala, o
      # cache antigo é descartado e ninguém fica preso numa versão velha.
      # Antes isso dependia de lembrar de subir CACHE_VERSION à mão — e não deu certo.
      - name: Carimbar a versão do build
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::7}"
          BUILT_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          sed -i "s|^const BUILD_ID = 'dev';|const BUILD_ID = '${VERSION}';|" sw.js
          sed -i "s|^export const APP_VERSION = 'dev';|export const APP_VERSION = '${VERSION}';|" src/version.js
          printf '{"version":"%s","builtAt":"%s"}\n' "$VERSION" "$BUILT_AT" > version.json

          # Falha o deploy se algum carimbo não pegou: publicar sem versão nova
          # recriaria exatamente o bug de cache que isto existe para evitar.
          grep -q "^const BUILD_ID = '${VERSION}';" sw.js
          grep -q "^export const APP_VERSION = '${VERSION}';" src/version.js
          echo "Versão publicada: ${VERSION} (${BUILT_AT})"

      - name: Avisar se a API Key não foi configurada
        run: |
          if grep -qE "^export const API_KEY = '';" src/config.js; then
            echo "::warning file=src/config.js::API_KEY está vazia — o app vai abrir na tela de configuração."
          fi

      # enablement: true liga o Pages (modo GitHub Actions) na primeira execução,
      # em vez de exigir que alguém configure em Settings -> Pages antes.
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v5
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v5
