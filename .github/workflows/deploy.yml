# Publica o app no GitHub Pages a cada push na main.
# O projeto é 100% estático (sem build): o job só empacota os arquivos e envia.

name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez; não cancela a que já está rodando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Avisar se a API Key não foi configurada
        run: |
          if grep -qE "^export const API_KEY = '';" src/config.js; then
            echo "::warning file=src/config.js::API_KEY está vazia — o app vai abrir na tela de configuração."
          fi

      - name: Desligar o processamento Jekyll do Pages
        run: touch .nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
